<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>air canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        #board { display: block; background-color: #ffffff; cursor: none; }
        #videoElement {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            border: 2px solid #ccc;
            border-radius: 10px;
            transform: scaleX(-1); /* 거울 모드 */
            background-color: #000;
        }
        #overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            transform: scaleX(-1);
            pointer-events: none;
        }
        #cursor {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: blue;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
        }
        #instruction {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: sans-serif;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            line-height: 1.5;
        }
    </style>
    <!-- MediaPipe 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
    <canvas id="board"></canvas>
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="cursor"></div>
    <div id="instruction">
        <strong>조작 방법:</strong><br>
        - 검지만 펴기: 선 그리기<br>
        - 검지 + 중지 펴기: 그리기 일시정지 (파란 커서)<br>
        - 주먹 쥐었다 활짝 펴기: 전체 지우기<br>
        - 검지 + 중지 펴고 <strong>왼쪽으로 90도 눕히기</strong>: 한 획 뒤로가기
    </div>

    <script>
        const board = document.getElementById('board');
        const ctx = board.getContext('2d');
        const videoElement = document.getElementById('videoElement');
        const overlay = document.getElementById('overlay');
        const overlayCtx = overlay.getContext('2d');
        const cursor = document.getElementById('cursor');

        // 캔버스 사이즈 설정
        board.width = window.innerWidth;
        board.height = window.innerHeight;
        overlay.width = 320;
        overlay.height = 240;

        // 상태 변수
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let smoothedX = 0, smoothedY = 0;
        const alpha = 0.4; // EMA 획 안정화 수치

        let strokes = []; // 뒤로가기를 위한 전체 획 데이터
        let currentStroke = []; // 현재 긋고 있는 획

        let wasFist = false;
        let canUndo = true; // 뒤로가기 연속 실행 방지 플래그

        // 초기 화면 설정
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, board.width, board.height);

        function redrawBoard() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, board.width, board.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            strokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            });
        }

        function undoLastStroke() {
            if (strokes.length > 0) {
                strokes.pop();
                redrawBoard();
            }
        }

        function saveCurrentStroke() {
            if (currentStroke.length > 0) {
                strokes.push([...currentStroke]);
                currentStroke = [];
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        camera.start();

        function onResults(results) {
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(overlayCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                // 카메라가 좌우 반전되어 있으므로 좌표 매핑 시 1 - x 처리
                const screenX = (1 - landmarks[8].x) * board.width;
                const screenY = landmarks[8].y * board.height;

                // 각 손가락 펴짐 여부 확인
                const isIndexExtended = landmarks[8].y < landmarks[6].y;
                const isMiddleExtended = landmarks[12].y < landmarks[10].y;
                const isRingExtended = landmarks[16].y < landmarks[14].y;
                const isPinkyExtended = landmarks[20].y < landmarks[18].y;

                const isFist = !isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended;
                const isOpenPalm = isIndexExtended && isMiddleExtended && isRingExtended && isPinkyExtended;

                // 손가락 방향 계산 (MCP 관절부터 손가락 끝까지의 x, y 변화량)
                const dxIndex = landmarks[8].x - landmarks[5].x; 
                const dyIndex = landmarks[8].y - landmarks[5].y;
                
                // 좌우 반전된 화면 기준으로 실제 손가락이 왼쪽을 가리킬 때 dx > 0이 됨
                const isTiltedLeft = dxIndex > 0.08 && Math.abs(dxIndex) > Math.abs(dyIndex) * 1.5;
                const isUndoGesture = isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended && isTiltedLeft;

                // 1. 뒤로가기 제스처 (검지+중지만 펴고 왼쪽으로 기울임)
                if (isUndoGesture) {
                    cursor.style.display = 'none';
                    isDrawing = false;
                    saveCurrentStroke();
                    
                    if (canUndo) {
                        undoLastStroke();
                        canUndo = false; // 제스처 유지 중 중복 실행 방지
                    }
                    return; 
                } else {
                    canUndo = true; // 제스처가 풀리면 쿨다운 초기화
                }

                // 2. 전체 지우기 제스처 (주먹 -> 펴기)
                if (isFist) {
                    wasFist = true;
                    cursor.style.display = 'none';
                    isDrawing = false;
                    saveCurrentStroke();
                    return;
                }
                if (isOpenPalm) {
                    if (wasFist) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, board.width, board.height);
                        strokes = [];
                        currentStroke = [];
                        wasFist = false;
                    } else {
                        cursor.style.display = 'none';
                        isDrawing = false;
                        saveCurrentStroke();
                    }
                    return;
                }

                // 3. 일시정지 (검지+중지 수직으로 펴기)
                if (isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                    cursor.style.display = 'block';
                    cursor.style.left = `${screenX}px`;
                    cursor.style.top = `${screenY}px`;
                    wasFist = false;
                    
                    if (isDrawing) {
                        isDrawing = false;
                        saveCurrentStroke();
                    }
                    smoothedX = screenX;
                    smoothedY = screenY;
                    return;
                }

                // 4. 선 그리기 (검지만 펴기)
                if (isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                    wasFist = false;
                    cursor.style.display = 'none';

                    if (!isDrawing) {
                        isDrawing = true;
                        smoothedX = screenX;
                        smoothedY = screenY;
                        lastX = screenX;
                        lastY = screenY;
                        currentStroke = [{x: screenX, y: screenY}];
                    } else {
                        // EMA 획 안정화
                        smoothedX = (alpha * screenX) + ((1 - alpha) * smoothedX);
                        smoothedY = (alpha * screenY) + ((1 - alpha) * smoothedY);

                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(smoothedX, smoothedY);
                        ctx.stroke();

                        currentStroke.push({x: smoothedX, y: smoothedY});
                        lastX = smoothedX;
                        lastY = smoothedY;
                    }
                    return;
                }
                
                // 아무 제스처도 해당하지 않을 때
                cursor.style.display = 'none';
                if (isDrawing) {
                    isDrawing = false;
                    saveCurrentStroke();
                }
            } else {
                // 손이 화면에 없을 때
                cursor.style.display = 'none';
                if (isDrawing) {
                    isDrawing = false;
                    saveCurrentStroke();
                }
            }
        }

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            board.width = window.innerWidth;
            board.height = window.innerHeight;
            redrawBoard();
        });
    </script>
</body>
</html>
